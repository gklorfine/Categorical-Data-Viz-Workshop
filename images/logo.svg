    <path id="cat" d="M148 421C161 413 161 395 162 374C164 323 184 293 226 269C262 249 278 227 286 198L288 126Q288 120 293 124L323 151L355 130Q360 127 359 134L355 162Q371 174 378 193L402 204Q406 206 402 212L388 227Q380 236 359 236L344 238Q337 263 347 292Q357 322 351 357L347 398Q346 406 359 408Q374 409 376 421Z"/>
    <clipPath id="coat"><use href="#cat"/></clipPath>
    <clipPath id="patch"><path d="M148 219C229 252 275 257 343 228C348 265 324 284 324 315C324 345 337 368 316 389C297 407 263 404 226 404H148Z"/></clipPath>
  </defs>
