    <path d="M0 0V49.5A49.5 49.5 0 0 1 -49.5 0Z" fill="#000069"/>
    <path d="M-35.1 35.1L35.1 -35.1" stroke="#000" stroke-width="5.1" stroke-linecap="square"/>
    <path d="M-35.1 35.1L35.1 -35.1" stroke="white" stroke-width="2.7"/>
    <path d="M-56 0H56M0 -56V56" stroke="white" stroke-width="4.6"/>
    <path d="M-56 0H56M0 -56V56" stroke="#111321" stroke-width="1.7"/>
  </g>
  <use href="#cat" fill="#102957"/>
  <g clip-path="url(#coat)">
