<svg xmlns="http://www.w3.org/2000/svg" width="560" height="644" viewBox="0 0 560 644" role="img" aria-labelledby="title desc">
  <title id="title">Visualizing Categorical Data in R</title>
  <desc id="desc">A seated blue cat in profile. Its patterned coat crops a mosaic of hair and eye color, pooled over sex. Red tiles have negative Pearson residuals and blue tiles positive residuals under independence. Inside the tail, four quarter-disks share one origin. The illustrative two-by-two table has counts of 4 and 9 in the top row and 9 and 4 in the bottom row. Quarter-disk areas are proportional to those counts. A white diagonal joins the two blue sectors with more cases than expected.</desc>
